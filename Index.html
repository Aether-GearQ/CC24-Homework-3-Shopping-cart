<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./style.css">
    <title>Homework 03 : Shopping-cart page
    </title>
</head>

<body>
    <!-- <h1>Homework 03 : Shopping-cart</h1>
    <hr> -->
    <div class="page">
        <header class="head">
            <div class="head__logo">
                <div class="logo__img">
                    <i class="fa-solid fa-j" style="color: rgb(36, 209, 36);"></i>
                </div>
                <h2 class="logo__text">JobPasscard</h2>
            </div>
            <div class="head__link">
                <a href="" class="link--about-us">ABOUT US</a>
                <a href="" class="link--passcard">PASSCARD</a>
                <a href="" class="link--profile">PROFILE</a>
            </div>
            <div class="head__input">
                <a href="#" class="input__img--search1"><i class="fa-solid fa-magnifying-glass"
                        style="color: rgb(6, 7, 7);"></i></a>
                <a href="#" class="input__img--search2">
                    <i class="fa-solid fa-cart-shopping" style="color: rgb(6, 7, 7);"></i>
                    <p class="img--count">5</p>
                </a>
                <a href="" class="input__login">LOGIN</a>
                <a href="" class="input__singup">SIGN UP</a>
            </div>
        </header>   
        <div class="title">
            <h1>My Cart</h1>
        </div>
        <div class="maincontent">
            <div class="info">
                <div class="gdocs">
                    <div class="gdocs__delete">
                        <a href="#" class="delete__icon">
                            <i class="fa-solid fa-trash-can" style="color: rgb(36, 209, 36);"></i></a>
                    </div>
                    <div class="gdocs__info">
                        <div class="info__icon">
                            <i class="fa-regular fa-file-lines" style="color: rgb(83, 178, 236);"></i>
                        </div>
                        <div class="info__head">Google Docs</div>
                        <div class="info__text">Used for business</div>
                    </div>
                    <div class="gdocs__contant">
                        <div class="contant__head">
                            <h3>Google Docs</h3>
                        </div>
                        <div class="contant__input">
                            <div class="contant__input--checkbox">
                                <p class="r1"> </p>
                                <p class="r2"> </p>
                                <p class="r3"> </p>
                            </div>
                            <div class="contant__input--sec">
                                <select name="lv" id="lv">
                                    <option value="Select" disabled selected hidden>Lv 1-3</option>
                                    <option value="lv1_3">Lv 1-3</option>
                                    <option value="lv2_3">Lv 2-3</option>
                                    <option value="lv3_3">Lv 3-3</option>
                                </select>
                            </div>
                        </div>
                        <div class="contant__price">
                            <h3>THB 150</h3>
                        </div>
                    </div>
                </div>
                <div class="gslides">
                    <div class="gslides__delete">
                        <a href="#" class="delete__icon">
                            <i class="fa-solid fa-trash-can" style="color: rgb(36, 209, 36);"></i></a>
                    </div>
                    <div class="gslides__info">
                        <div class="info__icon">
                            <i class="fa-regular fa-file-lines" style="color: orange"></i>
                        </div>
                        <div class="info__head">Google Slides</div>
                        <div class="info__text">Used for business</div>
                    </div>
                    <div class="gslides__contant">
                        <div class="contant__head">
                            <h3>Google Slides</h3>
                        </div>
                        <div class="contant__input">
                            <div class="contant__input--checkbox">
                                <p class="r4"> </p>
                                <p class="r5"> </p>
                                <p class="r6"> </p>
                                <p class="r7"> </p>
                            </div>
                            <div class="contant__input--sec">
                                <select name="lv" id="lv">
                                    <option value="" disabled selected hidden>Lv 1-4</option>
                                    <option value="lv1_4">Lv 1-4</option>
                                    <option value="lv2_4">Lv 2-4</option>
                                    <option value="lv3_4">Lv 3-4</option>
                                    <option value="lv4_4">Lv 4-4</option>
                                </select>
                            </div>
                        </div>
                        <div class="contant__price">
                            <h3>THB 150</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="order">
                <div class="order__head">
                    <h3>Order Info</h3>
                </div>
                <div class="order__subtoal">
                    <h4>subtotal</h4>
                    <h4>THB 300</h4>
                </div>
                <div class="order__promotion">
                    <i class="fa-solid fa-ticket" style="color: rgb(6, 7, 7);"></i>
                    <input type="text" placeholder="Promotions code" class="code" value="">
                    <button class="promotions--apply" type="submit" value="#">APPLY</button>
                </div>
                <hr class="hr2"></hr>
                <div class="order__total">
                    <h4>Total payment</h4>
                    <h4>THB 300</h4>
                </div>
                <button class="log" type="submit" value="#">LOG IN TO CHECKOUT</button>
            </div>
        </div>
    </div>
    
</body>

</html>
